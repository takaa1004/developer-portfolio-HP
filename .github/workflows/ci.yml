name: CI

# 変更のたびに、壊れていないか・既知の脆弱性が無いかを自動で確かめる。
# Dependabot の更新PRにもこれが走る。緑ならマージしてよい。
# 週1回（月曜朝）も走らせて、コードを触っていない間に見つかった脆弱性も拾う。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # 本番で使う依存だけを見る。high 以上があれば赤くなる
      - run: pnpm audit --prod --audit-level high
